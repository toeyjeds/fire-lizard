services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fire-lizard-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai-network

  smtp:
    image: mailhog/mailhog:latest
    container_name: fire-lizard-smtp
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - ai-network

  cds-orch-service:
    build:
      context: ./cds-orch-service
    container_name: fire-lizard-orch-service
    environment:
      SQLSERVER_DB: ${SQLSERVER_DB}
      SQLSERVER_USER: ${SQLSERVER_USER}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD}
      SQLSERVER_HOST: ${SQLSERVER_HOST}
      SQLSERVER_PORT: ${SQLSERVER_PORT}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      AZURE_AAD_TENANT_ID: ${AZURE_AAD_TENANT_ID}
      AZURE_AAD_CLIENT_ID: ${AZURE_AAD_CLIENT_ID}
      AZURE_AAD_CLIENT_SECRET: ${AZURE_AAD_CLIENT_SECRET}
      AZURE_AAD_AUTHORITY: ${AZURE_AAD_AUTHORITY}
    depends_on:
      sqlserver:
        condition: service_healthy
      smtp:
        condition: service_started
    ports:
      - "8082:8082"
    networks:
      - ai-network

  cds-gateway-service:
    build:
      context: ./cds-gateway-service
    container_name: fire-lizard-gateway-service
    environment:
      ORCH_SERVICE_URL: http://cds-orch-service:8082
      GATEWAY_RATE_LIMIT_PER_SECOND: ${GATEWAY_RATE_LIMIT_PER_SECOND}
    depends_on:
      cds-orch-service:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - ai-network

  frontend:
    build:
      context: ./frontend
    container_name: fire-lizard-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - cds-gateway-service
    ports:
      - "3000:3000"
    networks:
      - ai-network


volumes:
  sqlserver_data:

networks:
  ai-network:
    driver: bridge
